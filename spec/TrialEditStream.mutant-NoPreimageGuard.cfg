\* Calibrated negative: apply observes the file but goes on to stage and
\* install over whatever it holds (the preimage guard removed). Same constants
\* as the positive configuration. Expected: a Safety (NoClobber) counterexample.
SPECIFICATION Spec
CONSTANTS
  Applies = {a1, a2}
  ExternalValues = {"other"}
  MaxTime = 2
  Expiry = 1
  None = None
  Observe <- MutantNoPreimageGuard
INVARIANT Safety
CHECK_DEADLOCK FALSE
