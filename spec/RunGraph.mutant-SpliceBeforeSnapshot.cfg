\* Calibrated negative: the splice published before its snapshot (a crash between).
\* Expected: a SnapshotsExist counterexample.
SPECIFICATION Spec
CONSTANTS
  Topology = "separate"
  MaxDrift = 1
  MaxCrashes = 1
  MaxWrites = 3
  Splicing = TRUE
  Recheck = "none"
  Mutant = "SpliceBeforeSnapshot"
INVARIANTS
  SnapshotsExist
CHECK_DEADLOCK FALSE
