\* Probe: a step done on report p in one clone, q delivered for the same invocation in the other; after the merge the step is stale and still done. Expected: a NoStaleDone counterexample (the state is reachable).
SPECIFICATION Spec
CONSTANTS
  Single = TRUE
  Recheck = TRUE
  SameStep = TRUE
  AdvanceOnDeliver = FALSE
  MaxCrashes = 1
  MaxDeliveries = 3
INVARIANTS
  NoStaleDone
PROPERTIES
  StaleNeverMovesBack
CHECK_DEADLOCK FALSE
