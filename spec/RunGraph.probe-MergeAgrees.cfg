\* Reachability, at RunGraph.cfg's bounds: two clones reach the same file set holding a done record.
\* Expected: a NoMergeEverAgrees counterexample.
SPECIFICATION Spec
CONSTANTS
  Topology = "separate"
  MaxDrift = 0
  MaxCrashes = 0
  MaxWrites = 2
  Splicing = TRUE
  Recheck = "none"
  Mutant = "none"
INVARIANTS
  NoMergeEverAgrees
CHECK_DEADLOCK FALSE
