[package]
name = "writfold-core"
description = "Writfold's pure decision kernels in plain safe Rust; the decisions named in start_from are translated to Lean 4 by Charon/Aeneas and proved under proofs/"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# No dependencies by construction: no IO, no floats, no trait objects
# (`diag` passes plain function pointers), `no_std` +
# `alloc`. The xtask dependency graph enforces the empty set.
# Strictness tier for `cargo tauten check` (docs/writfold/tauten-adoption.md).
[package.metadata.tauten]
tier = "kernel"

[dependencies]

# Read by Charon when the `proofs` gate translates this crate
# (proofs/extract.sh).
