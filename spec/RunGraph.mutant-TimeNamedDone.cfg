\* Calibrated negative: done files named by writer and time, not by node.
\* Expected: a OneDonePerNode counterexample.
SPECIFICATION Spec
CONSTANTS
  Topology = "separate"
  MaxDrift = 1
  MaxCrashes = 1
  MaxWrites = 3
  Splicing = TRUE
  Recheck = "none"
  Mutant = "TimeNamedDone"
INVARIANTS
  OneDonePerNode
CHECK_DEADLOCK FALSE
