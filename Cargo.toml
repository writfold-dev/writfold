[workspace]
members = [
    "crates/writfold-domain",
    "crates/writfold-core",
    "crates/writfold-kernel",
    "crates/writfold-wire",
    "crates/writfold-protocol",
    "crates/writfold-xtask",
    "crates/tuft",
    "crates/writfold-runtime",
    "crates/writfold-sources",
    "crates/writfold-store",
    "crates/writfold-kb",
    "crates/writfold-app",
    "crates/writfold-tui",
    "crates/writfold",
]
exclude = ["vendor/splicery"]
resolver = "3"

[workspace.package]
version = "0.3.0-dev.1"
edition = "2024"
rust-version = "1.98"
repository = "https://github.com/writfold-dev/writfold"
license = "MIT"
publish = false

[workspace.dependencies]
vstd = "=0.0.0-2026-09-06-0133"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }
num-bigint = "=0.4.8"
sha2 = "=0.11.0"
thiserror = "=2.0.20"
# Tuft `rx"..."` (bounded, linear-time) and exact substring search. Both are
# already locked through the vendored Splicery compiler; no new crate enters.
regex = { version = "=1.11.1", default-features = false, features = ["std", "perf"] }
memchr = { version = "=2.8.3", default-features = false, features = ["std"] }
# Derived, rebuildable KB index (KB v1). `bundled` compiles the SQLite
# amalgamation (with FTS5) into the static musl binary; no system library.
rusqlite = { version = "=0.37.0", features = ["bundled"] }
# `writfold watch` (T1): a read-only terminal view over the KB verbs, with
# the crossterm backend only. 0.29, not 0.30: 0.30's core needs hashbrown
# 0.17 with default features, which Cargo's workspace-wide feature
# resolution would add (allocator-api2, foldhash) to the core crates' graph.
ratatui = { version = "=0.29.0", default-features = false, features = ["crossterm"] }
ed25519-dalek = { version = "=2.2.0", features = ["pkcs8", "pem"] }
verus_syn = { version = "=0.0.0-2026-09-06-0133", features = ["full", "visit"] }
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
syn = { version = "=2.0.119", features = ["full", "visit"] }
splicery-domain = { path = "vendor/splicery/crates/splicery-domain" }
splicery-syntax = { path = "vendor/splicery/crates/splicery-syntax" }
splicery-compile = { path = "vendor/splicery/crates/splicery-compile" }
splicery-kernel = { path = "vendor/splicery/crates/splicery-kernel" }

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(verus_only)", "cfg(verus_keep_ghost)", "cfg(verus_keep_ghost_body)"] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
