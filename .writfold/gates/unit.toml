# Writfold's unit gate before pushing main (AGENTS.md): the workspace tests,
# integration tests included, run by scripts/gate in the admitted tools
# image. Its own receipt lands in the run's local artifacts directory,
# outside the checkout as scripts/gate requires.
#
# Scope decision. scripts/gate binds the whole checkout while it runs: any
# tracked or untracked file that changes during the run fails it, and
# writfold kb gate records such a run as unknown. The scope below is only for
# staleness afterwards. Tests read the crates, fixtures/, the guides under docs/guide/ (their JSON and TOML
# examples), README.md (its pre-release line) and the plugin's skills, so
# the scope is everything except prose no test reads: docs/writfold/,
# AGENTS.md and LICENSE, and the gate definitions themselves (a changed
# definition makes its receipts stale through the definition digest
# instead). A change to the design notes leaves a unit receipt satisfied; a
# crate edit, a guide edit or a README edit makes it stale.
schema = "writfold-gate/1"
id = "unit"
version = 1
class = "mechanical"
argv = ["scripts/gate", "unit", "--receipt", "{artifacts}/unit.json"]
workdir = "."
timeout_seconds = 10800
scope = [
  "**",
  "!docs/writfold/**",
  "!AGENTS.md",
  "!LICENSE",
  "!.writfold/**",
]
description = "the workspace tests (built once, run in parallel) through scripts/gate"
