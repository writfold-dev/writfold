\* Calibrated negative: the current node is the one after the last done node.
\* Expected: a CurrentIsFirstOpen counterexample.
SPECIFICATION Spec
CONSTANTS
  Topology = "separate"
  MaxDrift = 1
  MaxCrashes = 1
  MaxWrites = 3
  Splicing = TRUE
  Recheck = "none"
  Mutant = "CurrentAfterLastDone"
INVARIANTS
  CurrentIsFirstOpen
CHECK_DEADLOCK FALSE
