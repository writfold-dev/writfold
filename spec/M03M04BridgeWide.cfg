\* Causal admission-race workload: three reader/engine incarnations, four releases.
\* One GC worker; identity-safe physical slot reuse and all teardown boundaries.
\* Safety-only; specification stuttering is permitted at every state.
SPECIFICATION TransferSpec
CONSTANTS
 Readers = {reader1, reader2, reader3}
 Releases = {0, 1, 2, 3}
 InitialRelease = 0
 Incarnations = {inc1, inc2, inc3}
 Pids = {pid1, pid2}
 Children = {child1, child2, child3}
 Owner = supervisorOwner
 Instance = localInstance
 KnowledgeBase = logicalKB
INVARIANTS FiniteEnvironment WorkType Inv Safety TransferEpochBound
CHECK_DEADLOCK FALSE
