\* Two sessions in one clone, every decision re-checked under the lock
\* (Recheck "all", proposed). Every property holds, DonePrefix included.
SPECIFICATION Spec
CONSTANTS
  Topology = "same"
  MaxDrift = 1
  MaxCrashes = 1
  MaxWrites = 3
  Splicing = TRUE
  Recheck = "all"
  Mutant = "none"
INVARIANTS
  TypeOK
  OneDonePerNode
  EvidenceNamed
  AdvanceOnlyWhenMet
  SnapshotsExist
  FoldOrderIndependent
  CurrentIsFirstOpen
  SpliceIdempotentLocal
  DonePrefix
PROPERTIES
  DoneOnlyGrows
  SplicePreserves
  CurrentNeverBack
CHECK_DEADLOCK FALSE
