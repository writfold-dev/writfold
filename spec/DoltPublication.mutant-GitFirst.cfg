\* Calibrated negative: the prepared commit and the completed-ref CAS come
\* before the Dolt write. Expected: a PublishedPinIsCommittedHead
\* counterexample (a visible release naming a commit that was never made).
SPECIFICATION Spec
CONSTANTS
  Table <- PositiveTable
  MaxDirect = 1
  None = None
  DoltWrite <- DoltWriteGitFirst
INVARIANT PublishedPinIsCommittedHead
CHECK_DEADLOCK FALSE
