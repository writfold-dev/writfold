\* Boundary probe, outside the trial profile: an external writer that can
\* write the candidate's exact bytes. Recovery decides by bytes, so it may
\* reconcile Applied for an install that never happened. Expected: a Safety
\* (AppliedMeansInstalled) counterexample; documents the cooperating-writer
\* assumption, not a defect of the positive configuration.
SPECIFICATION Spec
CONSTANTS
  Applies = {a1, a2}
  ExternalValues = {"other", "candidate"}
  MaxTime = 2
  Expiry = 1
  None = None
INVARIANT Safety
CHECK_DEADLOCK FALSE
