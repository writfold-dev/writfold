\* Finite identity bounds, not runtime integer restrictions.
\* Profile 2: each input independently toggles full/its fixed missing pair.
\* Missing pairs for inputs 1..5: kernel/c2, source/c3, policy/c2, signature/c3, kernel/c1.
\* No global fault cap; colliding inputs 1/2 can fail differently with input 4 valid.
\* Together profiles 0..3 exercise all twelve check/context pairs; never mix profiles.
\* Three distinct contexts, all protocol/crash/legacy actions; no symmetry or fairness.
SPECIFICATION WideSpec2
CONSTANTS
  WriterCount = 3
  InputCount = 5
  ContextCount = 3
INVARIANTS
  Inv
  Safety
CHECK_DEADLOCK FALSE
