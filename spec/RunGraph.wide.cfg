\* As RunGraph.cfg with drift, a crash and three decisions per session (did not finish).
SPECIFICATION Spec
CONSTANTS
  Topology = "separate"
  MaxDrift = 1
  MaxCrashes = 1
  MaxWrites = 3
  Splicing = TRUE
  Recheck = "none"
  Mutant = "none"
INVARIANTS
  TypeOK
  OneDonePerNode
  EvidenceNamed
  AdvanceOnlyWhenMet
  SnapshotsExist
  FoldOrderIndependent
  CurrentIsFirstOpen
  SpliceIdempotentLocal
PROPERTIES
  DoneOnlyGrows
  SplicePreserves
  CurrentNeverBack
CHECK_DEADLOCK FALSE
