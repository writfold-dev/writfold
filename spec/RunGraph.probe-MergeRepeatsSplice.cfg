\* Probe: two clones each splice a template the other has also spliced on
\* one ancestor chain; each was right in its own clone. Expected: a
\* SpliceIdempotent counterexample after the merge.
SPECIFICATION Spec
CONSTANTS
  Topology = "separate"
  MaxDrift = 1
  MaxCrashes = 1
  MaxWrites = 3
  Splicing = TRUE
  Recheck = "all"
  Mutant = "none"
INVARIANTS
  SpliceIdempotent
CHECK_DEADLOCK FALSE
