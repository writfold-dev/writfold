name = "Kctx"
version = "0.1.0"
defaultTargets = ["Kctx", "kctxref"]

# No dependencies: Lean core only (no mathlib), per the handover's
# "avoid importing large libraries unless they materially simplify the proof".

[[lean_lib]]
name = "Kctx"


[[lean_exe]]
name = "kctxref"
root = "Kctx.Reference"

[[lean_exe]]
name = "engineeringref"
root = "Kctx.Engineering.Reference"

[[lean_exe]]
name = "citationref"
root = "Kctx.Citation.Reference"

[[lean_exe]]
name = "procedurecases"
root = "Kctx.Engineering.ProcedureCases"
