\* Causal sequential-publication workload composed with engine lifecycle.
\* Old readers share an incarnation; one can close while the other keeps reading.
\* Safety-only; specification stuttering is permitted at every state.
SPECIFICATION BackupSpec
CONSTANTS
 Readers = {reader1, reader2}
 Releases = {0, 1, 2}
 InitialRelease = 0
 Incarnations = {inc1, inc2}
 Pids = {pid1, pid2}
 Children = {child1, child2}
 Owner = supervisorOwner
 Instance = localInstance
 KnowledgeBase = logicalKB
INVARIANTS FiniteEnvironment WorkType Inv Safety BackupEpochBound
CHECK_DEADLOCK FALSE
