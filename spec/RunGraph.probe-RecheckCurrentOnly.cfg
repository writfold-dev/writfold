\* Probe: one clone, re-checking under the lock only that the decided node
\* is still current (not that a use's ordinal is still the next). Expected:
\* a SplicePreserves counterexample: another session splices under N and
\* closes its steps, N is current again, and the late splice, at the same
\* ordinal under N, sorts by template name before the closed steps.
SPECIFICATION Spec
CONSTANTS
  Topology = "same"
  MaxDrift = 1
  MaxCrashes = 1
  MaxWrites = 3
  Splicing = TRUE
  Recheck = "current"
  Mutant = "none"
PROPERTIES
  SplicePreserves
CHECK_DEADLOCK FALSE
