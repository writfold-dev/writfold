\* Positive fixed-recovery-workload profile; no phase/scheduling cutoff.
\* Both recovery workers target exact input1; repeated same-input completion/repair competes.
\* Two publication writers still choose ANY exact input; only recovery-start targets are fixed.
\* Every recovery phase, retry, crash/restart, IO error, conflict and refusal remains enabled by its guards.
\* DetectCorruption admits every subset of Releases independently: current/ancestry/target faults may coexist.
\* Hint op1 ranges over IDs0/1/2/InputCount and every phase; other hints are empty.
\* Admission fixture has at most one missing check globally; corruption is NOT capped.
\* No fairness or eventual-progress claim. Historical input identity is not a runtime integer bound.
SPECIFICATION SameInputBridgeSpec
CONSTANTS
  WriterCount = 2
  InputCount = 4
  ContextCount = 2
INVARIANTS
  BridgeInv
  BridgeSafety
  HistoricalAuthentic
CHECK_DEADLOCK FALSE
CONSTRAINT FiniteObservationBound
