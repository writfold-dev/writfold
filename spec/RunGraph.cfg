\* Two sessions in two clones that merge, splicing as built (section 24),
\* create-new the only check under the lock. Every property holds except
\* DonePrefix, which a merge can break (RunGraph.probe-MergeDisorder).
SPECIFICATION Spec
CONSTANTS
  Topology = "separate"
  MaxDrift = 1
  MaxCrashes = 1
  MaxWrites = 3
  Splicing = TRUE
  Recheck = "none"
  Mutant = "none"
INVARIANTS
  TypeOK
  OneDonePerNode
  EvidenceNamed
  AdvanceOnlyWhenMet
  SnapshotsExist
  FoldOrderIndependent
  CurrentIsFirstOpen
  SpliceIdempotentLocal
PROPERTIES
  DoneOnlyGrows
  SplicePreserves
  CurrentNeverBack
CHECK_DEADLOCK FALSE
