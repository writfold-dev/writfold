name: Bug report
description: Something Writfold does is broken, wrong or a regression.
labels: ["bug", "needs-triage"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran and what it printed (exit code too). Trim private paths.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: The smallest KB or steps that show it. A failing test is best.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `writfold --version` (and the commit for a source build).
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS / WSL, Git version.
