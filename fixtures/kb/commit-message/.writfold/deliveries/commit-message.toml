# A user-defined delivery mode: a commit message draft, checked before
# `git commit`. No Writfold code names this mode; this file defines it.
#
#   writfold kb deliver prepare --mode commit-message --audience external --from MSG
#   writfold kb deliver check            # references.denied and commit-format
#   writfold kb deliver attest --check language-guidelines --statement TEXT --by WHO
#   git commit -F MSG                    # only once deliver status exits 0
#
# The honest limit is in the description, which deliver status prints:
# the guard binds the checked bytes for git commit under a route
# (guard.toml); a commit made outside the hook is not seen.
schema = "writfold-delivery-mode/1"
mode = "commit-message"
description = "checked before git commit; the guard binds the checked bytes under its route, and a commit made outside the hook is not seen"
checks = ["references.denied"]
gates = ["commit-format", "language-guidelines"]
