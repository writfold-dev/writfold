# Proof claims for `cargo tauten proofs` (docs/writfold/tauten-adoption.md).
# Written by hand; proofs/claims_coverage.py checks every required theorem
# is claimed or in proofs/unclaimed.txt (#124). The gate (proofs/tauten-gate.sh) decides each outcome
# and `cargo tauten proofs` records it in proofs/claims.json.
version = 1

[gate]
command = ["sh", "proofs/tauten-gate.sh"]
# `cargo tauten proofs --level ship` and `proofs try` append the mutants to
# run, comma-separated (#91).
try = ["sh", "proofs/tauten-gate.sh", "--only"]
crates = ["crates/writfold-core"]

[[claim]]
crate = "writfold-core"
file = "crates/writfold-core/src/bind.rs"
function = "answered_from"
lean = "writfold_core.bind.answered_from"
theorems = [
  "Writfold.Core.Bind.answered_from_loop_spec",
  "Writfold.Core.Bind.answered_from_total",
]
total = "Writfold.Core.Bind.answered_from_total"
subsumes = ["TAU-N001", "TAU-P003"]
mutants = [
  "answered-ignores-grounded",
  "answered-reads-past-end",
]

[[claim]]
crate = "writfold-core"
file = "crates/writfold-core/src/bind.rs"
function = "answers"
lean = "writfold_core.bind.answers"
theorems = [
