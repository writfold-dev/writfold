\* Reachability: two clones reach the same file set holding a done record.
\* Expected: a NoMergeEverAgrees counterexample.
SPECIFICATION Spec
CONSTANTS
  Topology = "separate"
  MaxDrift = 1
  MaxCrashes = 1
  MaxWrites = 3
  Splicing = TRUE
  Recheck = "none"
  Mutant = "none"
INVARIANTS
  NoMergeEverAgrees
CHECK_DEADLOCK FALSE
