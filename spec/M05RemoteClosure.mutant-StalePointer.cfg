\* Finite qualification fixture; not an execution receipt.
\* Two independent remote clients; 0 -> 1 -> 3 is three generations.
\* Wider: third local writer, third context, and 0 -> 1 -> 3 -> 5.
\* No symmetry, state constraint, phase bound, or global failure-count cap.
\* FiniteInit selects four documented simultaneous remote failure profiles.
\* FiniteNext selects four per-input authority profiles independently.
\* All protocol phases, crashes/restarts, transfer and restore remain enabled.
\* Explicit Stutter is terminal convention, not a liveness assertion.
CONSTANTS
  WriterCount = 2
  InputCount = 4
  ContextCount = 2
  ClientCount = 2
INIT FiniteInit
NEXT StalePointerNext
INVARIANT Safety
CHECK_DEADLOCK FALSE
\* Mutant: transfer+verify local 3 while remote head is 0; advertise skips 1.
\* Or stale client rewinds 3 to previously verified 1, losing advertised history.
\* Intended failure: Safety predecessor/history order, not TypeOK.
