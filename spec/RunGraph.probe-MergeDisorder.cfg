\* Probe: two clones with every re-check on. No lock spans clones, so a
\* merge can still put an open step before a done one. Expected: a
\* DonePrefix counterexample.
SPECIFICATION Spec
CONSTANTS
  Topology = "separate"
  MaxDrift = 1
  MaxCrashes = 1
  MaxWrites = 3
  Splicing = TRUE
  Recheck = "all"
  Mutant = "none"
INVARIANTS
  DonePrefix
CHECK_DEADLOCK FALSE
