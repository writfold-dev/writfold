\* Probe: two sessions in one clone as built (create-new is the only check
\* under the lock). Expected: a DonePrefix counterexample (a splice under
\* a step another session closed meanwhile, or an advance past a fresh splice).
SPECIFICATION Spec
CONSTANTS
  Topology = "same"
  MaxDrift = 1
  MaxCrashes = 1
  MaxWrites = 3
  Splicing = TRUE
  Recheck = "none"
  Mutant = "none"
INVARIANTS
  DonePrefix
CHECK_DEADLOCK FALSE
