[workspace]
members = [
    "crates/writfold-domain",
    "crates/writfold-core",
    "crates/writfold-xtask",
    "crates/writfold-runtime",
    "crates/writfold-sources",
    "crates/writfold-kb",
    "crates/writfold-app",
    "crates/writfold-tui",
    "crates/writfold",
]
resolver = "3"

[workspace.package]
version = "0.6.0-dev.18"
edition = "2024"
rust-version = "1.98"
repository = "https://github.com/writfold-dev/writfold"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }
sha2 = "=0.11.0"
thiserror = "=2.0.20"
# Bounded, linear-time patterns (guard rules, watch filters). `unicode`
# keeps `\d`, `\w` and case folding as they were when the retired Splicery
# crates enabled it by feature unification (#54).
regex = { version = "=1.11.1", default-features = false, features = ["std", "perf", "unicode"] }
# Derived, rebuildable KB index (KB v1). `bundled` compiles the SQLite
# amalgamation (with FTS5) into the static musl binary; no system library.
rusqlite = { version = "=0.37.0", features = ["bundled"] }
# `writfold watch` (T1): a read-only terminal view over the KB verbs, with
# the crossterm backend only. 0.29, not 0.30: 0.30's core needs hashbrown
# 0.17 with default features, which Cargo's workspace-wide feature
# resolution would add (allocator-api2, foldhash) to the core crates' graph.
ratatui = { version = "=0.29.0", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
# `writfold` and `writfold kb` argument parsing (#55): pure Rust, no C,
# no TLS; default features off, only what help, suggestions and colour need.
clap = { version = "=4.6.7", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "color", "derive", "string"] }
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
syn = { version = "=2.0.119", features = ["full", "visit"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
# An arithmetic overflow outside the proved kernel aborts instead of
# wrapping (TAU-H001, tauten 0.0.4+). Owner decision, #62.
overflow-checks = true
