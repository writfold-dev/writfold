\* Reachability probe for the authority-timing decision: a claim made under
\* valid authority completes its install after the approval expired. The
\* expected "violation" of NoInstallAfterExpiry is the witness; Safety (with
\* ClaimUnderAuthority) still holds in the positive configuration.
SPECIFICATION Spec
CONSTANTS
  Applies = {a1, a2}
  ExternalValues = {"other"}
  MaxTime = 2
  Expiry = 1
  None = None
INVARIANT NoInstallAfterExpiry
CHECK_DEADLOCK FALSE
