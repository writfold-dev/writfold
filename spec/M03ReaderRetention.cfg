\* Causal backup workload: admit old readers, then publish candidates sequentially.
\* Independent backup roots overlap; old history can retire while a reader stays.
\* Safety-only; specification stuttering is permitted at every state.
SPECIFICATION BackupSpec
CONSTANTS
 Readers = {reader1, reader2}
 Releases = {0, 1, 2}
 InitialRelease = 0
INVARIANTS FiniteEnvironment WorkType Inv Safety BackupEpochBound
CHECK_DEADLOCK FALSE
