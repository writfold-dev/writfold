\* Reachability, at RunGraph.cfg's bounds: a spliced child step is done.
\* Expected: a NoNestedDone counterexample.
SPECIFICATION Spec
CONSTANTS
  Topology = "separate"
  MaxDrift = 0
  MaxCrashes = 0
  MaxWrites = 2
  Splicing = TRUE
  Recheck = "none"
  Mutant = "none"
INVARIANTS
  NoNestedDone
CHECK_DEADLOCK FALSE
