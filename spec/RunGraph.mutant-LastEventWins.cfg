\* Calibrated negative: a node done and skipped takes the event listed last.
\* Expected: a DoneOnlyGrows counterexample.
SPECIFICATION Spec
CONSTANTS
  Topology = "separate"
  MaxDrift = 1
  MaxCrashes = 1
  MaxWrites = 3
  Splicing = TRUE
  Recheck = "none"
  Mutant = "LastEventWins"
PROPERTIES
  DoneOnlyGrows
CHECK_DEADLOCK FALSE
