name: writfold

x-qualified-tools: &qualified-tools
  image: ${WRITFOLD_TOOL_IMAGE:?Run scripts/gate bootstrap to admit the tool image}
  pull_policy: never
  platform: linux/amd64
  working_dir: /work/writfold
  cpus: ${WRITFOLD_BUILD_CPUS:-8}
  mem_limit: ${WRITFOLD_BUILD_MEMORY:-12884901888}
  pids_limit: 1024
  init: true
  environment:
    CARGO_TARGET_DIR: /cache/target/rust-1.98.0
    CARGO_BUILD_JOBS: ${WRITFOLD_BUILD_JOBS:-8}
    PYTHONDONTWRITEBYTECODE: "1"
    PYTHONPATH: /work/writfold/src
    TERM: xterm-256color
    GIT_CONFIG_COUNT: "1"
    GIT_CONFIG_KEY_0: safe.directory
    GIT_CONFIG_VALUE_0: /work/writfold
  volumes:
    - type: bind
      source: .
      target: /work/writfold
      read_only: true
    - type: bind
      source: ${WRITFOLD_ATTEMPT:?Select an out-of-tree qualification attempt}
      target: /evidence
    - cargo-target:/cache/target
    - cargo-registry:/opt/cargo/registry
    - cargo-git:/opt/cargo/git

services:
  tools:
    build:
      context: .
      dockerfile: docker/Dockerfile.tools
    image: writfold-tools:bootstrap
    profiles: [bootstrap]
  dev:
    <<: *qualified-tools
    volumes:
      - type: bind
        source: .
        target: /work/writfold
        read_only: false
      - type: bind
        source: ${WRITFOLD_ATTEMPT:?Select an out-of-tree qualification attempt}
        target: /evidence
      - cargo-target:/cache/target
      - cargo-registry:/opt/cargo/registry
      - cargo-git:/opt/cargo/git
    command: [bash]
    stdin_open: true
    tty: true
  quality:
    <<: *qualified-tools
    network_mode: none
    command: [python3, scripts/writfold_quality.py]
  stdio-control:
    <<: *qualified-tools
    network_mode: none
    command: [python3, scripts/writfold_stdio.py]
  unit:
    <<: *qualified-tools
    network_mode: none
    command: [cargo, test, --workspace, --locked, --offline]
  verus:
    <<: *qualified-tools
    network_mode: none
    command: [python3, scripts/writfold_verus.py]
  citation-verus:
    <<: *qualified-tools
    network_mode: none
    command: [python3, scripts/writfold_verus.py, --profile, qualification/citation-verus-profile.json, --package, writfold-kernel]
  reference:
    <<: *qualified-tools
    network_mode: none
    command: [python3, scripts/writfold_tools.py]
  build:
    <<: *qualified-tools
    network_mode: none
    command: [cargo, build, --workspace, --release, --target, x86_64-unknown-linux-musl, --locked, --offline]
  engineering-lean:
    <<: *qualified-tools
    network_mode: none
    command: [python3, scripts/writfold_engineering_lean.py]
  citation-lean:
    <<: *qualified-tools
    network_mode: none
    command: [python3, scripts/writfold_citation_lean.py]

volumes:
  cargo-target:
    name: writfold-rust-1.98.0-target
  cargo-registry:
    name: writfold-rust-1.98.0-registry
  cargo-git:
    name: writfold-rust-1.98.0-git
