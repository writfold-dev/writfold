# An example to edit (writfold kb init --example delivery): a candidate
# gate that ships its own script. {candidate} is the payload file; the
# script's bytes are part of the definition digest.
schema = "writfold-gate/1"
id = "commit-format"
version = 1
class = "mechanical"
subject = "candidate"
argv = ["sh", "{gate}/commit_format.sh", "{candidate}"]
timeout_seconds = 10
description = "subject at most 72 characters, a blank second line, body wrapped at 72"
accept = ["satisfied"]
