\* Calibrated negative: advance whatever the gate, naming the newest receipt.
\* Expected: a AdvanceOnlyWhenMet counterexample.
SPECIFICATION Spec
CONSTANTS
  Topology = "separate"
  MaxDrift = 1
  MaxCrashes = 1
  MaxWrites = 3
  Splicing = TRUE
  Recheck = "none"
  Mutant = "AdvanceIgnoresGates"
INVARIANTS
  AdvanceOnlyWhenMet
CHECK_DEADLOCK FALSE
