\* Calibrated negative: the Dolt write commits on the current head without
\* its expected-old check. Expected: a NoDoublePublication counterexample
\* (an interrupted operation publishes again and commits twice).
SPECIFICATION Spec
CONSTANTS
  Table <- PositiveTable
  MaxDirect = 1
  None = None
  DoltWrite <- DoltWriteNoGuard
INVARIANT NoDoublePublication
CHECK_DEADLOCK FALSE
