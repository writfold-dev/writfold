\* Calibrated negative: apply accepts a three-record run (claimed, no outcome)
\* and dispatches the effect again instead of refusing. Same constants as the
\* positive configuration. Expected: a Safety (NoSecondDispatch) counterexample.
SPECIFICATION Spec
CONSTANTS
  Applies = {a1, a2}
  ExternalValues = {"other"}
  MaxTime = 2
  Expiry = 1
  None = None
  Start <- MutantResumeClaimed
INVARIANT Safety
CHECK_DEADLOCK FALSE
