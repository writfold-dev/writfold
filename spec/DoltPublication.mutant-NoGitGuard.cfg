\* Calibrated negative: admit without the Git expected-old check. A successor
\* signed over a prepared but unpublished release then commits on Dolt over
\* the interrupted attempt. Expected: an ObserveAgrees counterexample (the
\* successor's own commit at the head resolves Diverged).
SPECIFICATION Spec
