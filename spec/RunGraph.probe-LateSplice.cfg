\* Probe: two clones share one root plan; one splices under a step the
\* other has meanwhile closed (no `!late-splice`, section 24.10). Every
\* re-check on. Expected: a DonePrefixOneRoot counterexample after a merge.
SPECIFICATION Spec
CONSTANTS
  Topology = "separate"
  MaxDrift = 1
  MaxCrashes = 1
  MaxWrites = 3
  Splicing = TRUE
  Recheck = "all"
  Mutant = "none"
INVARIANTS
  DonePrefixOneRoot
CHECK_DEADLOCK FALSE
